<!DOCTYPE html>
<html lang="en-AU">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z3K6EV9E3H"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Z3K6EV9E3H');

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You — Still &amp; Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Google+Sans+Code:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F1DD;--paper:#FAF7EC;--oat:#C9BDA5;--char:#241F21;--coffee:#59493A;
    --serif:"Moulin","Cormorant Garamond",Georgia,serif;
    --mono:"Google Sans Code",ui-monospace,Menlo,monospace;
    --gutter:clamp(20px,5vw,72px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--char);font-family:var(--mono);font-weight:300;font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px var(--gutter);border-bottom:1px solid rgba(36,31,33,.08)}
  .wordmark{font-family:var(--serif);font-size:20px;letter-spacing:.32em;text-decoration:none;white-space:nowrap}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(48px,10vw,120px) var(--gutter)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--coffee)}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(36px,4vw,56px);line-height:1.1;margin:20px 0 24px;letter-spacing:.01em}
  p{max-width:42ch;margin:0 auto 20px;color:var(--coffee)}
  .back{display:inline-block;margin-top:24px;border:1px solid var(--char);padding:15px 36px;text-decoration:none;font-size:12px;letter-spacing:.22em;text-transform:uppercase;transition:background .2s}
  .back:hover{background:var(--cream)}
  footer{border-top:1px solid rgba(36,31,33,.1);padding:56px var(--gutter);display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coffee)}
</style>
</head>
<body>
<header>
  <a class="wordmark" href="/">STILL &amp; SOCIAL</a>
</header>
<main>
  <p class="eyebrow">Order confirmed</p>
  <h1>Thank you.</h1>
  <p>Your order is on its way. We'll send you a confirmation email with tracking details once it ships.</p>
  <p>We hope this small ritual brings a moment of pause to your day.</p>
  <a class="back" href="/shop/">Back to Shop</a>
</main>
<footer>
  <span>Still &amp; Social &middot; Rituals of Good Living</span>
  <a href="https://stillandsocial.com.au" style="text-decoration:none">stillandsocial.com.au</a>
</footer>
<script>try { localStorage.removeItem("ss_cart"); } catch(e) {}</script>
</body>
</html>
